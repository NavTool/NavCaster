# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Package Windows Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "*[0-9]*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: windows-latest-amd64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Assets
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          TAG_VERSION="$(git describe --tags --always --dirty=-dev)"
          PACKAGE_NAME="NavCaster-${TAG_VERSION}-${{ matrix.version }}"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run package script
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        run: .\deploy\ci\build_in_windows.ps1

      - name: Archive package
        shell: pwsh
        run: |
          $packageName = "${{ steps.meta.outputs.package_name }}"
          $packageDir = Join-Path $PWD "release\$packageName"
          $archivePath = Join-Path $PWD "release\$packageName.zip"
          if (Test-Path $archivePath) {
              Remove-Item $archivePath -Force
          }
          Compress-Archive -Path $packageDir -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: ./release/${{ steps.meta.outputs.package_name }}.zip
          if-no-files-found: error