# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Package Windows Release (legacy, disabled)

# Temporarily disabled. The active build/package pipeline is
# .github/workflows/build-and-package.yml. This file is kept for
# reference and can be re-enabled later when needed.
on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: windows-latest-amd64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Run package script
        id: package
        shell: pwsh
        run: |
          $env:PACKAGE_PLATFORM = "${{ matrix.version }}"
          .\deploy\scripts\package_windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ./dist/${{ steps.package.outputs.archive_file }}
          if-no-files-found: error
