name: Build and Package (Windows & Ubuntu 20.04 Docker)

on:
  push:
    branches: [ "main", "proto", "develop", "team-dev" ]
    tags: [ "v*", "*[0-9]*" ]
  pull_request:
    branches: [ "main", "team-dev" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  REDIS_VERSION: 8.6.3 # NavCaster minimum is Redis 8.4.0; CI packages the verified default.

jobs:
  # ---------------------------------------------------------------------------
  # Ubuntu 20.04 package build inside Docker
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (ubuntu-20.04-amd64 Docker)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      LINUX_VERSION: ubuntu-20.04-amd64
      LINUX_PLATFORM: linux/amd64
      LINUX_BASE_IMAGE: ubuntu:20.04
      LINUX_BUILDER_IMAGE: navcaster-linux-builder:ubuntu-20.04-amd64
      LINUX_BUILDER_CONTAINER: navcaster-linux-builder-ubuntu-20-04-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu 20.04 builder image
        run: |
          docker buildx build \
            --platform "${LINUX_PLATFORM}" \
            --tag "${LINUX_BUILDER_IMAGE}" \
            --build-arg "BASE_IMAGE=${LINUX_BASE_IMAGE}" \
            -f deploy/docker/dockerfile.debian \
            --load .

      - name: Run package script inside Ubuntu 20.04 container
        run: |
          docker run --name "${LINUX_BUILDER_CONTAINER}" \
            --platform "${LINUX_PLATFORM}" \
            -d "${LINUX_BUILDER_IMAGE}"

          docker exec "${LINUX_BUILDER_CONTAINER}" mkdir -p /workspace
          docker cp ./. "${LINUX_BUILDER_CONTAINER}:/workspace"
          docker exec -w /workspace "${LINUX_BUILDER_CONTAINER}" \
            git config --global --add safe.directory /workspace
          docker exec -w /workspace "${LINUX_BUILDER_CONTAINER}" cmake --version
          docker exec -w /workspace "${LINUX_BUILDER_CONTAINER}" ninja --version
          docker exec -w /workspace "${LINUX_BUILDER_CONTAINER}" node --version
          docker exec -w /workspace "${LINUX_BUILDER_CONTAINER}" npm --version
          docker exec -w /workspace "${LINUX_BUILDER_CONTAINER}" chmod +x deploy/scripts/package_linux.sh
          docker exec \
            -e BUILD_TYPE="${BUILD_TYPE}" \
            -e PACKAGE_PLATFORM="${LINUX_VERSION}" \
            -e REDIS_VERSION="${REDIS_VERSION}" \
            -w /workspace "${LINUX_BUILDER_CONTAINER}" \
            bash deploy/scripts/package_linux.sh

      - name: Archive package
        id: package
        run: |
          mkdir -p output
          docker cp \
            "${LINUX_BUILDER_CONTAINER}:/workspace/dist/package-metadata.env" \
            ./output/package-metadata.env
          source ./output/package-metadata.env
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_file=${ARCHIVE_FILE}" >> "$GITHUB_OUTPUT"
          docker cp \
            "${LINUX_BUILDER_CONTAINER}:/workspace/dist/${ARCHIVE_FILE}" \
            "./output/${ARCHIVE_FILE}"

      - name: Cleanup Linux builder container
        if: always()
        run: |
          docker stop "${LINUX_BUILDER_CONTAINER}" || true
          docker rm "${LINUX_BUILDER_CONTAINER}" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ./output/${{ steps.package.outputs.archive_file }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows native build (MSVC)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build (windows-2022-amd64)
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      PACKAGE_PLATFORM: windows-2022-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Run package script
        id: package
        shell: pwsh
        run: |
          .\deploy\scripts\package_windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ./dist/${{ steps.package.outputs.archive_file }}
          if-no-files-found: error
