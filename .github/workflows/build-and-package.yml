name: Build and Package (Windows & Ubuntu 24.04)

on:
  push:
    branches: [ "main", "proto", "develop" ]
    tags: [ "v*", "*[0-9]*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  REDIS_VERSION: 8.6.3 # NavCaster minimum is Redis 8.4.0; CI packages the verified default.

jobs:
  # ---------------------------------------------------------------------------
  # Ubuntu 24.04 native build
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (ubuntu-24.04-amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config ca-certificates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Assets
        working-directory: ./web
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Configure CMake
        run: cmake -S . -B build/ci-${{ env.BUILD_TYPE }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Run schema smoke
        run: |
          cmake --build build/ci-${{ env.BUILD_TYPE }} --target schema_smoke --parallel
          ctest --test-dir build/ci-${{ env.BUILD_TYPE }} --output-on-failure -R schema_smoke

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          TAG_VERSION="$(git describe --tags --always --dirty=-dev)"
          PACKAGE_NAME="NavCaster-${TAG_VERSION}-ubuntu-24.04-amd64"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run package script
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          REDIS_VERSION: ${{ env.REDIS_VERSION }}
        run: |
          chmod +x deploy/ci/build_in_linux.sh
          bash deploy/ci/build_in_linux.sh

      - name: Archive package
        run: |
          tar -C release -czf release/${{ steps.meta.outputs.package_name }}.tar.gz \
            ${{ steps.meta.outputs.package_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: ./release/${{ steps.meta.outputs.package_name }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows native build (MSVC)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build (windows-latest-amd64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Assets
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build\ci-${{ env.BUILD_TYPE }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl

      - name: Run schema smoke
        shell: pwsh
        run: |
          cmake --build build\ci-${{ env.BUILD_TYPE }} --target schema_smoke --config ${{ env.BUILD_TYPE }} --parallel
          ctest --test-dir build\ci-${{ env.BUILD_TYPE }} --build-config ${{ env.BUILD_TYPE }} --output-on-failure -R schema_smoke

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          TAG_VERSION="$(git describe --tags --always --dirty=-dev)"
          PACKAGE_NAME="NavCaster-${TAG_VERSION}-windows-latest-amd64"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run package script
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        shell: pwsh
        run: .\deploy\ci\build_in_windows.ps1

      - name: Archive package
        shell: pwsh
        run: |
          $packageName = "${{ steps.meta.outputs.package_name }}"
          $packageDir = Join-Path $PWD "release\$packageName"
          $archivePath = Join-Path $PWD "release\$packageName.zip"
          if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
          Compress-Archive -Path $packageDir -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: ./release/${{ steps.meta.outputs.package_name }}.zip
          if-no-files-found: error
