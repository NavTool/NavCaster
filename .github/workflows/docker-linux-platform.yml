name: Package Linux Multi-Distro

# Build & package NavCaster for several Linux distributions inside Docker
# (so the produced binaries link against the target distro's glibc).
#
# Active workflows on push are:
#   - build-and-package.yml  (Ubuntu 20.04 Docker + Windows)
#   - this one               (multi-distro Docker matrix)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "*[0-9]*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  REDIS_VERSION: 8.6.3 # NavCaster minimum is Redis 8.4.0; CI packages the verified default.

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: ubuntu-20.04-amd64
            platform: linux/amd64
            dockerfile: deploy/docker/dockerfile.debian
            docker_img: ubuntu:20.04
          - version: ubuntu-24.04-amd64
            platform: linux/amd64
            dockerfile: deploy/docker/dockerfile.debian
            docker_img: ubuntu:24.04
          - version: ubuntu-22.04-amd64
            platform: linux/amd64
            dockerfile: deploy/docker/dockerfile.debian
            docker_img: ubuntu:22.04
          - version: debian-12-amd64
            platform: linux/amd64
            dockerfile: deploy/docker/dockerfile.debian
            docker_img: debian:12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up QEMU for multi-platform support
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --tag build-image-${{ matrix.version }} \
            --build-arg BASE_IMAGE=${{ matrix.docker_img }} \
            -f ${{ matrix.dockerfile }} \
            --load .

      - name: Start container
        run: |
          docker run --name build-container-${{ matrix.version }} \
            --platform ${{ matrix.platform }} \
            -d build-image-${{ matrix.version }}

      - name: Run build inside container
        run: |
          docker exec build-container-${{ matrix.version }} mkdir -p /workspace
          docker cp ./. build-container-${{ matrix.version }}:/workspace
          docker exec -w /workspace build-container-${{ matrix.version }} \
            git config --global --add safe.directory /workspace
          docker exec -w /workspace build-container-${{ matrix.version }} cmake --version
          docker exec -w /workspace build-container-${{ matrix.version }} ninja --version
          docker exec -w /workspace build-container-${{ matrix.version }} node --version
          docker exec -w /workspace build-container-${{ matrix.version }} npm --version
          docker exec -w /workspace build-container-${{ matrix.version }} \
            chmod +x deploy/scripts/package_linux.sh
          docker exec \
            -e BUILD_TYPE="${BUILD_TYPE}" \
            -e PACKAGE_PLATFORM="${{ matrix.version }}" \
            -e REDIS_VERSION="${REDIS_VERSION}" \
            -w /workspace build-container-${{ matrix.version }} \
            bash deploy/scripts/package_linux.sh

      - name: Copy artifacts from container
        id: package
        run: |
          mkdir -p output
          docker cp \
            build-container-${{ matrix.version }}:/workspace/dist/package-metadata.env \
            ./output/package-metadata.env
          source ./output/package-metadata.env
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_file=${ARCHIVE_FILE}" >> "$GITHUB_OUTPUT"
          docker cp \
            build-container-${{ matrix.version }}:/workspace/dist/${ARCHIVE_FILE} \
            "./output/${ARCHIVE_FILE}"

      - name: Cleanup container
        if: always()
        run: |
          docker stop build-container-${{ matrix.version }} || true
          docker rm build-container-${{ matrix.version }} || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ./output/${{ steps.package.outputs.archive_file }}
          if-no-files-found: error
