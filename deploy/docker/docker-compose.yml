# NavCaster all-in-one runtime stack (Ubuntu 24.04 based).
#
# Prerequisites:
#   1) Build the current commit runtime image from the repo root:
#        bash deploy/scripts/build_runtime_image.sh
#      The script prints NAVCASTER_IMAGE=navcaster:team-dev-<short12>.
#
#   2) From the repo root run:
#        export NAVCASTER_IMAGE=navcaster:team-dev-<short12>
#        docker compose -f deploy/docker/docker-compose.yml up -d
#
# Override the package directory (relative to repo root) only for rebuilds:
#        NAVCASTER_PACKAGE=dist/NavCaster-v1.2.3-ubuntu-20.04-amd64 \
#          docker compose -f deploy/docker/docker-compose.yml up -d

services:
  caster_service:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.runtime
      args:
        BASE_IMAGE: ubuntu:24.04
        PACKAGE_DIR: ${NAVCASTER_PACKAGE:-dist/NavCaster-local}
        VCS_REF: ${NAVCASTER_VCS_REF:-unknown}
        VERSION: ${NAVCASTER_VERSION:-local}
        SOURCE: ${NAVCASTER_SOURCE:-https://github.com/NavTool/NavCaster}
        CREATED: ${NAVCASTER_CREATED:-unknown}
    image: "${NAVCASTER_IMAGE:?Set NAVCASTER_IMAGE to an immutable tag such as navcaster:team-dev-<short12>}"
    container_name: caster_container
    ports:
      - "4202:4202"   # Ntrip caster
      - "8080:8080"   # Runtime health / metrics
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - caster_logs:/app/logs
      # 如需在容器外维护配置，取消注释并准备 ./runtime/conf/ 目录
      # - ./runtime/conf:/app/conf
    networks:
      - caster_network

  redis:
    # NavCaster requires Redis Open Source 8.4.0+; 8.6.3 is the verified default.
    image: redis:8.6.3
    container_name: redis_container
    # Redis 仅供 caster_service 内部访问。如需对外暴露，设置 REDIS_PORT
    # 或自行调整下方端口映射。
    expose:
      - "6379"
    ports:
      - "${REDIS_PORT:-16379}:6379"
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    sysctls:
      - net.core.somaxconn=1024
    volumes:
      - redis_data:/data
    networks:
      - caster_network

volumes:
  caster_logs:
  redis_data:

networks:
  caster_network:
    driver: bridge
