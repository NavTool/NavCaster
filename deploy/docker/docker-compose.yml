# NavCaster all-in-one runtime stack (Ubuntu 24.04 based).
#
# Prerequisites:
#   1) Build a Linux package locally, e.g. from the repo root:
#        BUILD_TYPE=Release \
#        PACKAGE_NAME=NavCaster-local \
#        bash deploy/ci/build_in_linux.sh
#      This produces ./release/NavCaster-local with CasterService,
#      conf/, web/, env/redis/ etc.
#
#   2) From the repo root run:
#        docker compose -f deploy/docker/docker-compose.yml up -d
#
# Override the package directory (relative to repo root) via env:
#        NAVCASTER_PACKAGE=release/NavCaster-v1.2.3-ubuntu-24.04-amd64 \
#          docker compose -f deploy/docker/docker-compose.yml up -d

services:
  caster_service:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.runtime
      args:
        BASE_IMAGE: ubuntu:24.04
        PACKAGE_DIR: ${NAVCASTER_PACKAGE:-release/NavCaster-local}
    image: navcaster:latest
    container_name: caster_container
    ports:
      - "4202:4202"   # Ntrip caster
      - "8080:8080"   # HTTP / Web UI
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - caster_logs:/app/logs
      # 如需在容器外维护配置，取消注释并准备 ./runtime/conf/ 目录
      # - ./runtime/conf:/app/conf
    networks:
      - caster_network

  redis:
    image: redis:8.6.3
    container_name: redis_container
    # Redis 仅供 caster_service 内部访问。如需对外暴露，设置 REDIS_PORT
    # 或自行调整下方端口映射。
    expose:
      - "6379"
    ports:
      - "${REDIS_PORT:-16379}:6379"
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    sysctls:
      - net.core.somaxconn=1024
    volumes:
      - redis_data:/data
    networks:
      - caster_network

volumes:
  caster_logs:
  redis_data:

networks:
  caster_network:
    driver: bridge
