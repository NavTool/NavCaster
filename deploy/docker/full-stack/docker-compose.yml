name: ${COMPOSE_PROJECT_NAME:-navcaster}

x-navcaster-app-build: &navcaster-app-build
  context: .
  dockerfile: Dockerfile.navcaster

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navcaster}
      POSTGRES_USER: ${POSTGRES_USER:-navcaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:8.6.3}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin:
    build: *navcaster-app-build
    image: ${NAVCASTER_APP_IMAGE:-navcaster/full-stack-app:local}
    restart: unless-stopped
    command: ["/opt/navcaster/bin/navcaster-admin"]
    environment:
      NAVCASTER_ADMIN_ADDR: ":8080"
      NAVCASTER_ADMIN_VERSION: ${NAVCASTER_VERSION:-local}
      NAVCASTER_ADMIN_BOOTSTRAP_TOKEN: ${NAVCASTER_ADMIN_BOOTSTRAP_TOKEN:-change-me-bootstrap-token}
      NAVCASTER_ADMIN_DEV_ADMIN_USERNAME: ${NAVCASTER_ADMIN_DEV_ADMIN_USERNAME:-admin}
      NAVCASTER_ADMIN_DEV_ADMIN_PASSWORD: ${NAVCASTER_ADMIN_DEV_ADMIN_PASSWORD:-change-me-admin-password}
      NAVCASTER_ADMIN_POSTGRES_DSN: "postgres://${POSTGRES_USER:-navcaster}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-navcaster}?sslmode=disable"
      NAVCASTER_ADMIN_MIGRATIONS_DIR: "/opt/navcaster/app/admin/migrations"
      NAVCASTER_ADMIN_REDIS_ADDR: "redis:6379"
    ports:
      - "${ADMIN_PORT:-18080}:8080"
    volumes:
      - ./logs/admin:/var/log/navcaster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: ${NAVCASTER_WEB_IMAGE:-navcaster/full-stack-web:local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./logs/web:/var/log/nginx
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent-1:
    build: *navcaster-app-build
    image: ${NAVCASTER_APP_IMAGE:-navcaster/full-stack-app:local}
    restart: unless-stopped
    stop_signal: SIGINT
    command: ["/opt/navcaster/bin/navcaster-agent"]
    environment:
      NAVCASTER_AGENT_ADMIN_URL: "http://admin:8080"
      NAVCASTER_AGENT_BOOTSTRAP_TOKEN: ${NAVCASTER_ADMIN_BOOTSTRAP_TOKEN:-change-me-bootstrap-token}
      NAVCASTER_AGENT_ID: ${AGENT_1_ID:-ag-compose-1}
      NAVCASTER_AGENT_HOST_ID: ${AGENT_1_HOST_ID:-host-compose-agent-1}
      NAVCASTER_AGENT_STATE_PATH: "/var/lib/navcaster-agent/agent_state.json"
      NAVCASTER_AGENT_RUNTIME_ROOT: "/var/lib/navcaster-agent/runtime"
      NAVCASTER_AGENT_CASTER_EXECUTABLE: "/opt/navcaster/bin/navcaster-caster"
      NAVCASTER_AGENT_CASTER_WORKING_DIR: "/var/lib/navcaster-agent/caster"
      NAVCASTER_AGENT_CASTER_LISTEN_HOST: "0.0.0.0"
      NAVCASTER_AGENT_CASTER_HEALTH_HOST: "0.0.0.0"
      NAVCASTER_AGENT_CASTER_HEALTH_PORT: ${AGENT_1_CASTER_HEALTH_PORT:-14202}
      NAVCASTER_AGENT_CASTER_REDIS_HOST: "redis"
      NAVCASTER_AGENT_CASTER_REDIS_PORT: 6379
      NAVCASTER_AGENT_HEARTBEAT_INTERVAL: "10s"
      NAVCASTER_AGENT_POLL_INTERVAL: "5s"
      NAVCASTER_AGENT_REQUEST_TIMEOUT: "5s"
      NAVCASTER_AGENT_STOP_TIMEOUT: "8s"
      NAVCASTER_AGENT_PROBE_TIMEOUT: "3s"
    ports:
      - "${AGENT_1_CASTER_NTRIP_PORT:-4202}:${AGENT_1_CASTER_NTRIP_PORT:-4202}"
      - "${AGENT_1_CASTER_HEALTH_PORT:-14202}:${AGENT_1_CASTER_HEALTH_PORT:-14202}"
    volumes:
      - ./data/agents/agent-1:/var/lib/navcaster-agent
      - ./logs/agent-1:/var/log/navcaster
    depends_on:
      admin:
        condition: service_healthy
      redis:
        condition: service_healthy
