// 数据拉取信息
syntax = "proto3";

package caster.monitor;
import "Common.proto";

message PullInfo {
  string uid = 1;

  string   login_mpt = 4; // 接入的挂载点
  PullType type      = 5;

  string target_ip       = 6;
  string target_port     = 7;
  string target_mpt      = 8;
  string target_account  = 9;
  string target_password = 10;

  uint64 create_time = 2; // 创建日期
  uint64 update_time = 3; // 修改日期

}