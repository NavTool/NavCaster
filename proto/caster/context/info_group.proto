// 用户组信息 account
syntax = "proto3";
package caster.context;

// 账号的注册信息
message GroupInfo {
  string uid         = 1;
  uint64 create_time = 2; // 创建日期
  uint64 update_time = 3; // 修改日期
    // 账号的基本信息



}



// 每个用户都可以访问公共挂载点
// 每个用户有自己的唯一分组（策略组）   （策略组内记录了自己可以访问的基站组）

// 每个基站可以控制自己是否是公共挂载点
// 一个基站可以同时属于多个分组（基站组）


// 在实际使用的时候
// 获取数据     用户 -> 查询挂载点是否在线 -> 查询公共挂载点是否包含自己所需的挂载点 -> 如果没有找到，查询自己的用户组 -> 查询可访问的基站组 -> 查找各个基站组是否包含自己要访问的基站
// 获取源列表   用户 -> 构建所有在线公共挂载点 -> 查找自己的用户组，构建所有私有且在线的挂载点
