syntax = "proto3";
package caster.core;

// 节点状态信息

message CasterNode {
  string uid            = 1; // 节点唯一标识
  string node_name      = 2; // 节点名称

  string set_version    = 3; // 软件版本
  string tag_version    = 4; // 完整tag版本
  string run_platform   = 5; // 运行平台

  double cpu_usage      = 6; // CPU使用率
  double mem_usage      = 7; // 内存使用率
  uint64 queue_delay    = 8; // 队列延迟(微秒)
  uint64 sub_ping_delay = 9; // SUB连接PING延迟(微秒)
  uint64 sub_tcp_delay  = 10; // SUB连接TCP延迟(微秒)
  uint64 pub_ping_delay = 11; // PUB连接PING延迟(微秒)
  uint64 pub_tcp_delay  = 12; // PUB连接TCP延迟(微秒)

  uint64 send_total     = 13; // 发送总字节数
  double send_speed     = 14; // 发送速率
  uint64 recv_total     = 15; // 接收总字节数
  double recv_speed     = 16; // 接收速率

  uint64 connect_count  = 17; // 总连接数
  uint64 server_count   = 18; // 基站连接数
  uint64 client_count   = 19; // 移动站连接数

  uint64 online_time    = 20; // 节点上线时刻
  uint64 update_time    = 21; // 状态更新时刻

  // 扩展信息 (v2 监控)
  string hostname       = 22; // 主机名
  uint32 listen_port    = 23; // NTRIP 监听端口
  uint32 http_port      = 24; // HTTP API 端口 (0 表示未启用)
  uint64 process_id     = 25; // 进程 ID
  bool   http_enabled   = 26; // 当前节点是否对外开启 HTTP API

  // 扩展信息 (v3 监控/运维)
  uint32 sse_clients    = 27; // 当前 SSE 客户端连接数
  uint32 process_threads = 28; // 进程线程数 (来自 /proc 或 std::thread)
  uint64 last_audit_seq = 29; // 该节点最近一次审计事件序号
  string log_level      = 30; // 当前日志级别 (trace/debug/info/warn/error)
}
