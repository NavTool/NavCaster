syntax = "proto3";
package caster.core;
import "Common.proto";

message PushRecord {
  string uid         = 1;
  uint64 create_time = 2; // 创建日期
  uint64 update_time = 3; // 修改日期

  string   login_mpt = 4; // 接入的挂载点
  PushType type      = 5;

  string target_ip       = 6;
  int32  target_port     = 7;
  string target_mpt      = 8;
  string target_account  = 9;
  string target_password = 10;

  bool enabled = 11; // 是否启用 (默认false，创建时设为true)
}