openapi: 3.1.0
info:
  title: NavCaster AdminService v2
  version: 0.1.0
  description: >
    First HTTP/JSON control-plane contract for navcaster-admin. v2 is not
    compatible with legacy HTTP APIs, Redis keys, protobufs, or naming rules.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Returns dependency status plus control-plane counters for PG/Redis/control intent observability.
      responses:
        "200":
          description: Service health and dependency configuration status.
  /api/v1/agents/register:
    post:
      summary: Register a host agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                bootstrap_token:
                  type: string
                agent_id:
                  type: string
                host_id:
                  type: string
                hostname:
                  type: string
                machine_id:
                  type: string
                os:
                  type: string
                arch:
                  type: string
                agent_version:
                  type: string
                labels:
                  type: object
      responses:
        "201":
          description: Registered agent identity and heartbeat interval.
  /api/v1/agents/heartbeat:
    post:
      summary: Accept an agent heartbeat and runtime summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, host_id]
              properties:
                agent_id:
                  type: string
                host_id:
                  type: string
                sequence:
                  type: integer
                resources:
                  type: object
                runtime_summaries:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Heartbeat accepted.
  /api/v1/agents/{agent_id}/desired-state:
    get:
      summary: Poll desired runtime state for an agent
      description: Returns desired state from PostgreSQL source-of-truth. When Redis is configured, AdminService also publishes the same host-level projection to control:desired-state:{host_id}.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: since_version
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Desired state changes after since_version.
  /api/v1/agents/{agent_id}/runtime-events:
    post:
      summary: Ingest runtime events from an agent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, host_id, events]
              properties:
                agent_id:
                  type: string
                host_id:
                  type: string
                events:
                  type: array
                  items:
                    $ref: "#/components/schemas/RuntimeEvent"
      responses:
        "202":
          description: Events persisted or accepted by the configured fallback repository.
  /api/v1/agents/{agent_id}/runtime-metrics:
    post:
      summary: Ingest runtime actual metrics from an agent
      description: Persists runtime_actual_snapshots when PostgreSQL is configured and returns latest actual state through control runtime APIs.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, host_id, actual]
              properties:
                agent_id:
                  type: string
                host_id:
                  type: string
                actual:
                  type: array
                  items:
                    $ref: "#/components/schemas/ActualSnapshot"
      responses:
        "202":
          description: Metrics accepted and latest actual state updated.
  /api/v1/control/hosts:
    get:
      summary: List registered hosts
      responses:
        "200":
          description: Host list.
  /api/v1/control/hosts/{host_id}:
    get:
      summary: Get one host
      parameters:
        - name: host_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host details.
  /api/v1/control/runtimes:
    get:
      summary: List runtimes
      description: Returns desired state, latest actual snapshot, and control convergence status for each runtime.
      responses:
        "200":
          description: Runtime list.
    post:
      summary: Create a runtime desired state
      description: Creates PostgreSQL desired state and Redis projection when Redis is configured. AdminService does not start processes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeCreateRequest"
      responses:
        "201":
          description: Runtime desired state created.
  /api/v1/control/runtimes/{runtime_id}:
    get:
      summary: Get one runtime
      description: Returns PostgreSQL desired state plus the latest actual snapshot ingested from Agent runtime metrics and derived converged/pending/failed/stale control state.
      parameters:
        - name: runtime_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runtime details.
  /api/v1/control/runtimes/{runtime_id}/events:
    get:
      summary: List runtime events
      description: Returns latest runtime_events for Web/QA inspection. Events are stored in PostgreSQL and may also advance matching action intents to observed or failed.
      parameters:
        - name: runtime_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 500
      responses:
        "200":
          description: Runtime event list.
  /api/v1/control/runtimes/{runtime_id}/intents:
    get:
      summary: List runtime action intents
      description: Returns latest action intents and their auditable lifecycle status.
      parameters:
        - name: runtime_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 200
      responses:
        "200":
          description: Action intent list.
  /api/v1/control/runtimes/{runtime_id}/desired-state:
    put:
      summary: Update runtime desired state
      description: Updates PostgreSQL desired state, increments desired version, writes audit facts, and republishes Redis projection when configured. Execution is left to navcaster-agent.
      parameters:
        - name: runtime_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                desired_state:
                  enum: [running, stopped, draining, deleted]
                config_version:
                  type: integer
                listen_port:
                  type: integer
                worker_count:
                  type: integer
                max_worker_count:
                  type: integer
                restart_policy:
                  enum: [never, on_failure, always]
                draining:
                  type: boolean
      responses:
        "200":
          description: Updated runtime desired state.
  /api/v1/control/runtimes/{runtime_id}/actions/start:
    post:
      summary: Record runtime start action intent
      description: Persists action intent, supersedes prior open intents for the runtime, bumps desired version, publishes Redis projections, and returns the intent lifecycle status. It does not execute a process directly.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "202":
          description: Start intent accepted.
  /api/v1/control/runtimes/{runtime_id}/actions/stop:
    post:
      summary: Record runtime stop action intent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "202":
          description: Stop intent accepted.
  /api/v1/control/runtimes/{runtime_id}/actions/restart:
    post:
      summary: Record runtime restart action intent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "202":
          description: Restart intent accepted.
  /api/v1/control/runtimes/{runtime_id}/actions/drain:
    post:
      summary: Record runtime drain action intent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "202":
          description: Drain intent accepted.
  /api/v1/control/runtimes/{runtime_id}/actions/undrain:
    post:
      summary: Record runtime undrain action intent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "202":
          description: Undrain intent accepted.
  /api/v1/control/projection-keys:
    get:
      summary: List Redis projection key registry
      responses:
        "200":
          description: Redis key registry.
components:
  schemas:
    RuntimeCreateRequest:
      type: object
      required: [host_id, config_version, listen_port, worker_count, max_worker_count, restart_policy]
      properties:
        host_id:
          type: string
        name:
          type: string
        desired_state:
          enum: [running, stopped, draining, deleted]
        config_version:
          type: integer
        listen_port:
          type: integer
        worker_count:
          type: integer
        max_worker_count:
          type: integer
        restart_policy:
          enum: [never, on_failure, always]
        start_immediately:
          type: boolean
    Runtime:
      type: object
      properties:
        runtime_id:
          type: string
        host_id:
          type: string
        name:
          type: string
        desired:
          $ref: "#/components/schemas/DesiredRuntime"
        actual:
          $ref: "#/components/schemas/ActualSnapshot"
        control:
          $ref: "#/components/schemas/RuntimeControl"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DesiredRuntime:
      type: object
      properties:
        runtime_id:
          type: string
        host_id:
          type: string
        desired_state:
          enum: [running, stopped, draining, deleted]
        config_version:
          type: integer
        listen_port:
          type: integer
        worker_count:
          type: integer
        max_worker_count:
          type: integer
        restart_policy:
          enum: [never, on_failure, always]
        draining:
          type: boolean
        version:
          type: integer
        generation:
          type: integer
        updated_at:
          type: string
          format: date-time
    ActualSnapshot:
      type: object
      required: [runtime_id, actual_state]
      properties:
        runtime_id:
          type: string
        host_id:
          type: string
        agent_id:
          type: string
        actual_state:
          type: string
        process_id:
          type: integer
        config_version:
          type: integer
        config_path:
          type: string
        config_checksum:
          type: string
        listen_port:
          type: integer
        worker_count:
          type: integer
        connections:
          type: integer
        mounts:
          type: integer
        sources:
          type: integer
        clients:
          type: integer
        send_bps:
          type: integer
        recv_bps:
          type: integer
        loop_delay_ms_p95:
          type: integer
        redis_connected:
          type: boolean
        observed_desired_version:
          type: integer
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time
    RuntimeControl:
      type: object
      required: [status, pending, failed, stale, stale_after_seconds]
      properties:
        status:
          enum: [converged, pending, failed, stale]
        desired_version:
          type: integer
        observed_desired_version:
          type: integer
        desired_state:
          enum: [running, stopped, draining, deleted]
        actual_state:
          type: string
        pending:
          type: boolean
        failed:
          type: boolean
        stale:
          type: boolean
        reason:
          type: string
        last_error:
          type: string
        last_observed_at:
          type: string
          format: date-time
        stale_after_seconds:
          type: integer
        latest_intent:
          $ref: "#/components/schemas/ActionIntent"
    ActionRequest:
      type: object
      properties:
        request_id:
          type: string
          description: Idempotency key. Reusing a request_id returns the existing intent instead of creating a new desired version.
        payload:
          type: object
    ActionIntent:
      type: object
      required: [intent_id, request_id, runtime_id, kind, status, desired_version, created_at, updated_at]
      properties:
        intent_id:
          type: string
        request_id:
          type: string
        runtime_id:
          type: string
        host_id:
          type: string
        kind:
          enum: [start, stop, restart, drain, undrain]
        status:
          enum: [accepted, projected, observed, superseded, failed]
        desired_version:
          type: integer
        payload:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        projected_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        superseded_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        failure_reason:
          type: string
    ControlPlaneStatus:
      type: object
      properties:
        status:
          enum: [ok, unavailable]
        repository:
          type: string
        host_count:
          type: integer
        runtime_count:
          type: integer
        desired_count:
          type: integer
        latest_desired_version:
          type: integer
        pending_intent_count:
          type: integer
        failed_intent_count:
          type: integer
        stale_runtime_count:
          type: integer
        updated_at:
          type: string
          format: date-time
        error:
          type: string
    RuntimeEvent:
      type: object
      required: [runtime_id, type]
      properties:
        event_id:
          type: string
        runtime_id:
          type: string
        type:
          type: string
        severity:
          type: string
        desired_version:
          type: integer
        process_id:
          type: integer
        message:
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
